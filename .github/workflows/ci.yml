name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest numpy
      - run: python src/e47_electroweak_identities.py
      - run: python -m pytest -q
      - run: python -m py_compile audit/e47_mass_ladder_look_elsewhere_audit.py
